<div class="container" *ngIf="person; else notFound">

  <div class="card shadow-sm">
    <div class="card-body">

      <h2 class="card-title mb-4">Person Details</h2>

      <div class="row mb-3">
        <div class="col-md-4">
          <strong>First Name:</strong>
          <p class="mb-0">{{ person.firstName }}</p>
        </div>

        <div class="col-md-4">
          <strong>Family Name:</strong>
          <p class="mb-0">{{ person.familyName }}</p>
        </div>

        <div class="col-md-2">
          <strong>Age:</strong>
          <p class="mb-0">{{ person.age }}</p>
        </div>
      </div>

      <hr>

      <h5 class="mb-3">Address</h5>

      <div class="row">
        <div class="col-md-4">
          <strong>City:</strong>
          <p class="mb-0">{{ person.address?.city }}</p>
        </div>

        <div class="col-md-4">
          <strong>Street:</strong>
          <p class="mb-0">{{ person.address?.street }}</p>
        </div>

        <div class="col-md-4">
          <strong>Post Code:</strong>
          <p class="mb-0">{{ person.address?.postCode }}</p>
        </div>
      </div>

      <div class="mt-4">
        <a routerLink="/" class="btn btn-outline-secondary">
          ← Back to list
        </a>
      </div>

    </div>
  </div>

</div>

<ng-template #notFound>
  <div class="container">
    <div class="alert alert-warning">
      Person not found.
    </div>
    <a routerLink="/" class="btn btn-outline-secondary">
      ← Back
    </a>
  </div>
</ng-template>
